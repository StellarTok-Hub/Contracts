[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (e.g. escrow -> fee-distribution) have
# no version to pin and are not a supply-chain risk — they're this repo's
# own code.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
