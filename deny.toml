[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` (transitive, via soroban-sdk-macros) is unmaintained
    # (RUSTSEC-2024-0436) but has no known vulnerability — it's a proc-macro
    # helper with a stable, minimal surface. Upstream (soroban-sdk) owns the
    # migration off it; revisit when a soroban-sdk release drops it.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (e.g. escrow -> fee-distribution) have
# no version to pin and are not a supply-chain risk — they're this repo's
# own code.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
